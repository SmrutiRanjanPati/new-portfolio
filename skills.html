<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />
    <title>Skills - Smruti Ranjan</title>
    <meta
      name="description"
      content="Design, tools, front-end and process skills of Smruti Ranjan Pati, UX/UI Product Designer."
    />
    <meta name="theme-color" content="#05060B" />
    <link
      rel="canonical"
      href="https://smrutiranjanpati.github.io/Smruti-ranjan/skills.html"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("sr-theme");
        var theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        if (theme === "light")
          document.documentElement.setAttribute("data-theme", "light");
      })();
    </script>
  </head>

  <body data-page="skills">
    <div data-component="header"></div>
    <main>
      <section class="card page-head reveal">
        <span class="page-eyebrow">Skills</span>
        <h1>Everything I work with</h1>
        <p class="lead">
          Design craft, tools, front-end and the way I work with teams. Search
          or filter, and follow the links to see a skill in a real project.
        </p>
        <div class="page-art" data-art="skills" aria-hidden="true"></div>
      </section>

      <section class="card reveal" style="margin-top: 20px">
        <div class="skills-toolbar">
          <div
            class="chip-row"
            id="skillTabs"
            role="tablist"
            aria-label="Skill categories"
          ></div>
          <label class="search-field">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input
              class="search-input"
              id="skillSearch"
              type="search"
              placeholder="Search skills (e.g. Figma, WCAG)"
              aria-label="Search skills"
            />
          </label>
        </div>
        <p class="skill-count" id="skillCount" aria-live="polite"></p>
        <div class="skill-grid" id="skillGrid"></div>
        <noscript
          ><p class="about-text">
            Enable JavaScript to browse skills, or see
            <a href="Smruti_Ranjan_Pati_Resume.pdf">my resume</a>.
          </p></noscript
        >
      </section>
      <div data-component="footer"></div>
    </main>

    <script src="js/data.js" defer></script>
    <script src="js/illustrations.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/skills.js" defer></script>
  </body>
</html>
